# Financial Analytics Platform Configuration

# Database Configuration
database:
  host: localhost
  port: 5432
  name: financial_analytics
  user: postgres
  password: ""

# Redis Cache Configuration
redis:
  host: localhost
  port: 6379
  db: 0

# API Configuration
api:
  host: 0.0.0.0
  port: 8000
  debug: false
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8501"

# Data Sources API Keys
data_sources:
  alpha_vantage_key: "${ALPHA_VANTAGE_API_KEY}"
  finnhub_key: "${FINNHUB_API_KEY}"
  openai_key: "${OPENAI_API_KEY}"
  fred_key: "${FRED_API_KEY}"

# Risk Analytics Configuration
risk:
  var:
    confidence_levels:
      - 0.95
      - 0.99
    time_horizons:
      - 1    # 1 day
      - 10   # 10 days
      - 252  # 1 year (trading days)
    simulation_runs: 10000
    methods:
      - parametric
      - historical
      - monte_carlo
  
  stress_test:
    scenarios:
      - market_crash
      - interest_rate_shock
      - credit_crisis
      - liquidity_crisis
      - pandemic
    severity_levels:
      - mild
      - moderate
      - severe
  
  credit:
    default_pd: 0.02  # 2% default probability
    lgd: 0.45  # 45% loss given default
    ead_buffer: 1.2  # 120% exposure at default buffer

# Machine Learning Configuration
ml:
  model_dir: models
  random_state: 42
  test_size: 0.2
  cv_folds: 5
  
  models:
    logistic_regression:
      max_iter: 1000
      solver: lbfgs
    
    random_forest:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
    
    xgboost:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
  
  hyperparameter_tuning:
    enabled: false
    method: grid_search
    n_iter: 20

# Dashboard Configuration
dashboard:
  theme: dark
  refresh_interval: 60  # seconds
  max_data_points: 1000
  default_chart_height: 400

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/financial_analytics.log
  max_file_size: 10485760  # 10MB
  backup_count: 5

# Performance Configuration
performance:
  cache_ttl: 300  # Cache time-to-live in seconds
  max_workers: 4  # Number of parallel workers
  batch_size: 1000  # Batch size for data processing

# Security Configuration
security:
  jwt_secret_key: "${JWT_SECRET_KEY}"
  jwt_expiry: 3600  # 1 hour
  enable_rate_limiting: true
  rate_limit: "100/minute"
